
{% extends "base.html" %}
{% load static %}

{% block title %}Вход — MedFlow{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container auth-container">
        <div class="auth-card">

            <div class="auth-heading">
                <span class="hero-label">С возвращением!</span>
                <h1>Вход в MedFlow</h1>
                <p>Войдите, чтобы управлять своими записями.</p>
            </div>

            <form id="login-form">
                {% csrf_token %}

                <div class="auth-field">
                    <label for="username">Логин</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Пароль</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="auth-message"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Войти
                </button>
            </form>

            <p class="auth-footer-text">
                Нет аккаунта?
                <a href="/register/">Зарегистрироваться</a>
            </p>

        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/login.js' %}" defer></script>
{% endblock %}
